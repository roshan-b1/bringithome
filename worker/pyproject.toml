[project]
name = "backtrack-worker"
version = "0.1.0"
description = "Backtrack transit recorders: one connector per data source, one table"
requires-python = ">=3.12"
dependencies = [
  "gtfs-realtime-bindings>=1.0",   # in the CLAUDE.md stack: decodes the bus GTFS-RT feed
  "psycopg[binary]>=3.2",          # Postgres driver for Tiger Data
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
backtrack-worker = "backtrack_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtrack_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
